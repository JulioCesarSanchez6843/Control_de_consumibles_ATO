<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control de consumibles</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('tema'))
        if (t === 'sistema') t = matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'oscuro'
        if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.tema = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
